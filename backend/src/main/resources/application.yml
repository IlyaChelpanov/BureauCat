spring:
  application:
    name: bureaucat
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bureaucat}
    username: ${DB_USER:bureaucat}
    password: ${DB_PASSWORD:bureaucat}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE:25MB}
      max-request-size: ${MAX_UPLOAD_SIZE:25MB}

management:
  endpoints:
    web:
      exposure:
        include: health

anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  model: ${ANTHROPIC_MODEL:claude-opus-4-8}
  summary-language: ${SUMMARY_LANGUAGE:Russian}
  # USD per million tokens, used for analysis_cost bookkeeping (claude-opus-4-8 prices)
  input-cost-per-mtok: ${ANTHROPIC_INPUT_COST_PER_MTOK:5.00}
  output-cost-per-mtok: ${ANTHROPIC_OUTPUT_COST_PER_MTOK:25.00}
