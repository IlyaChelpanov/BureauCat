services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-bureaucat}
      POSTGRES_USER: ${DB_USER:-bureaucat}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bureaucat}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-bureaucat} -d ${DB_NAME:-bureaucat}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # app service enabled once backend Dockerfile exists
  # app:
  #   build: ./backend
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     DB_URL: jdbc:postgresql://postgres:5432/bureaucat
